<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adega MM</title>
<meta name="description" content="Cervejas, doses, garrafas, combos e tabacaria. Peça pelo WhatsApp.">
<meta property="og:title" content="Adega MM">
<meta property="og:description" content="Cervejas, doses, garrafas, combos e tabacaria.">
<meta property="og:image" content="assets/img/logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  :root {
    --ink: #141110;
    --orange: #fa7d27;
    --orange-light: #ff9a4d;
    --text: #f7ede2;
    --text-dim: #ab9a8c;
    --hairline: rgba(250, 125, 39, 0.2);
    --glass: rgba(255, 255, 255, 0.035);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(250,125,39,0.16) 0%, transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .wrap {
    flex: 1 0 auto;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 52px 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .lockup {
    text-align: center;
    margin-bottom: 40px;
  }
  .lockup img {
    width: 108px;
    height: auto;
    margin: 0 auto 18px;
    display: block;
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(250, 125, 39, 0.18);
  }
  .wordmark {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 2.5rem;
    line-height: 1;
    margin: 0;
    color: var(--orange);
  }
  .sub-mark {
    margin: 12px 0 0;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .rule {
    width: 34px;
    height: 1px;
    background: var(--orange);
    opacity: 0.6;
    margin: 22px auto;
    border: 0;
  }
  .tagline {
    margin: 0;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--text-dim);
    letter-spacing: 0.015em;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 21px 20px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--text);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }
  .card:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--hairline);
  }
  .card:active { transform: scale(0.985); }
  .card:focus-visible {
    outline: 2px solid var(--orange);
    outline-offset: 3px;
  }

  .card.primary {
    background: linear-gradient(180deg, rgba(250,125,39,0.14) 0%, rgba(250,125,39,0.05) 100%);
    border-color: rgba(250, 125, 39, 0.4);
  }
  .card.primary:hover { border-color: rgba(250, 125, 39, 0.68); }

  .card .icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: var(--orange);
  }
  .card .icon svg { display: block; width: 100%; height: 100%; }

  .card .body { flex: 1 1 auto; min-width: 0; }
  .card .label {
    display: block;
    font-size: 1.12rem;
    font-weight: 500;
    letter-spacing: 0.028em;
    line-height: 1.25;
  }
  .card .meta {
    display: block;
    margin-top: 5px;
    font-size: 0.87rem;
    font-weight: 300;
    line-height: 1.45;
    color: var(--text-dim);
    letter-spacing: 0.012em;
  }
  .card .chev {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    color: var(--orange);
    opacity: 0.65;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .card:hover .chev { opacity: 1; transform: translateX(2px); }
  .card .chev svg { display: block; width: 100%; height: 100%; }

  .card.with-map {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 0;
    overflow: hidden;
  }
  .map-frame {
    position: relative;
    height: 168px;
    background: #1d1815;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .map-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--text-dim);
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(250,125,39,0.1) 0%, transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 34px);
  }
  .map-fallback svg { width: 26px; height: 26px; color: var(--orange); }
  .map-fallback span {
    font-size: 0.78rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .map-frame iframe {
    position: relative;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    filter: invert(0.9) hue-rotate(180deg) saturate(0.55) brightness(0.95) contrast(0.92);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .map-frame iframe.is-ready { opacity: 1; }
  .map-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,17,16,0.18) 0%, rgba(20,17,16,0.42) 100%);
    pointer-events: none;
  }
  .card .card-inner {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
  }

  footer {
    flex: 0 0 auto;
    text-align: center;
    padding: 34px 26px 30px;
    font-size: 0.66rem;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b6058;
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .lockup.reveal { animation-delay: 0.05s; }
    nav .reveal:nth-child(1) { animation-delay: 0.20s; }
    nav .reveal:nth-child(2) { animation-delay: 0.29s; }
    nav .reveal:nth-child(3) { animation-delay: 0.38s; }
    nav .reveal:nth-child(4) { animation-delay: 0.47s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  }

  @media (min-width: 480px) {
    .wrap { padding-top: 80px; }
    .wordmark { font-size: 2.8rem; }
  }
</style>
</head>
<body>

<div class="wrap">

    <h1 class="wordmark">Adega MM</h1>

          <path d="M8.5 8.2c.2-.45.4-.46.6-.47.16 0 .35 0 .5.02.16.02.38-.06.6.46.22.53.75 1.84.82 1.98.07.13.11.29.02.47-.09.18-.14.29-.27.44-.13.16-.28.35-.4.47-.13.13-.27.27-.12.53.16.27.7 1.15 1.5 1.86 1.03.92 1.9 1.21 2.16 1.35.27.13.42.11.58-.07.16-.18.68-.8.86-1.07.18-.27.36-.22.6-.13.25.09 1.58.75 1.85.88.27.13.45.2.51.31.07.13.07.71-.16 1.4-.24.68-1.38 1.3-1.9 1.38-.5.08-1.13.11-1.83-.11-.42-.13-.96-.31-1.66-.6-2.92-1.26-4.83-4.2-4.98-4.4-.15-.2-1.2-1.6-1.2-3.05 0-1.45.76-2.16 1.03-2.46Z" fill="currentColor" stroke="none"/>

    <a class="card with-map reveal" href="https://www.google.com/maps/search/?api=1&amp;query=Rua+Principal%2C+12+-+Divineia" target="_blank" rel="noopener">

      <span class="card-inner">
        <span class="icon" aria-hidden="true">

  </nav>

<footer>Adega MM</footer>

<script>
  (function () {
    var f = document.getElementById('mapFrame');
    if (!f) return;
    f.addEventListener('load', function () { f.classList.add('is-ready'); });
  })();
</script>

</body>
</html>
